name: Research software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python fixtures.py
      - run: python -m unittest discover -s tests -p "test_*.py" -q
      - run: python evaluation/run_integrity_matrix.py
      - run: python evaluation/recompute_historical.py
      - run: python examples/reproduce_example.py
