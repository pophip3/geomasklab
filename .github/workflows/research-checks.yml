name: Research software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ".[schema,geo,interop]"
      - run: python fixtures.py
      - run: python reviewer_demo.py
      - run: python -m pip install -r evaluation/requirements-evaluation.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -q
      - run: python evaluation/run_integrity_matrix.py
      - run: python evaluation/recompute_historical.py
      - run: python examples/reproduce_example.py
      - run: python examples/recalculate_region.py reviewer-output/right.zip
      - run: python examples/reference_workflow.py
      - run: python examples/real_image_handoff.py
      - run: python examples/geospatial_workflow.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python release/check_wheel.py --wheel-dir dist
      - run: python -m pip install --no-deps label-studio-sdk==2.1.2
      - run: python examples/compare_handoff.py
      - run: python label_studio_export.py reviewer-output/right.zip --output workflow-output/label-studio
      - run: python release/build_source.py --output source-package.zip
      - run: python release/check_distribution.py source-package.zip
