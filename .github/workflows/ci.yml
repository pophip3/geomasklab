name: Reviewer quickstart and coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reviewer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install .
      - run: python examples/reproduce_table.py
      - run: python examples/run_replay_demo.py
      - run: geomasklab-models --help
      - run: geomasklab-agent --help
      - run: geomasklab-sam --help
      - run: python -m unittest discover -s tests -p "test_model_*.py" -q
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-output-${{ matrix.os }}
          path: reviewer-output

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ".[schema,geo,interop,signing]" coverage==7.10.7
      - run: python -m coverage run --source=src/geomasklab -m unittest discover -s tests -p "test_*.py" -q
      - run: python -m coverage report --fail-under=80
      - run: python -m coverage json -o coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: coverage.json
