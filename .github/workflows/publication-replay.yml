name: Fixed publication packet replay
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived-packets:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python release/replay_publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-replay-${{ matrix.os }}
          path: publication-replay-output/summary.json
