[project]
name = "geomasklab-evaluation-lock"
version = "1.0.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==2.2.6",
  "requests==2.34.2",
  "Pillow==12.3.0",
  "matplotlib==3.10.6",
  "label-studio-sdk==2.1.2",
  "jsonschema>=4.18,<5",
  "rasterio>=1.3,<2",
  "pyproj>=3.6,<4",
  "prov>=2,<3",
  "cryptography>=42,<47",
]

[tool.uv]
environments = [
  "python_version >= '3.10' and python_version < '3.13' and sys_platform == 'win32' and platform_machine == 'AMD64'",
  "python_version >= '3.10' and python_version < '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
