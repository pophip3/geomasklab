[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "geomasklab"
dynamic = ["version"]
description = "Replayable evidence for scoped binary-mask measurements"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["Pillow>=10,<13"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.scripts]
geomasklab = "geomasklab.cli:main"
geomasklab-ui = "workbench.launcher:main"

[project.urls]
Documentation = "https://pophip3.github.io/geomasklab/"
Repository = "https://github.com/pophip3/geomasklab"
Issues = "https://github.com/pophip3/geomasklab/issues"

[project.optional-dependencies]
schema = ["jsonschema>=4.18,<5"]
geo = ["rasterio>=1.3,<2", "pyproj>=3.6,<4"]
interop = ["prov>=2,<3"]
signing = ["cryptography>=42,<47"]

[tool.setuptools]
include-package-data = false
packages = ["geomasklab", "workbench"]
py-modules = ["_source_package"]
package-dir = {"" = ".", geomasklab = "src/geomasklab", workbench = "workbench"}

[tool.setuptools.dynamic]
version = {attr = "geomasklab._version.VERSION"}

[tool.setuptools.package-data]
geomasklab = ["schemas/*.json"]
workbench = ["web/*.html", "web/*.css", "web/*.js", "web/assets/*.png", "web/assets/*.jpg", "web/assets/*.json"]
